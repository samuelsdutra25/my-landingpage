<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samuel Dutra | Front-end developer</title>
  <meta name="description" content="Portfolio of Samuel Dutra, a freelance front-end developer building fast landing pages and small business websites.">
  <meta name="theme-color" content="#FEF3E2">

  <!-- Open Graph. TODO: add og:image and og:url once the site has a public address. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Samuel Dutra | Front-end developer">
  <meta property="og:description" content="Portfolio of Samuel Dutra, a freelance front-end developer building fast landing pages and small business websites.">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/tailwind.css">
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="skip"></a>

  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-line bg-cream">
    <div class="wrap flex h-16 items-center justify-between gap-4 md:h-18">
      <a href="#top" class="text-xl font-bold">Samuel Dutra</a>

      <nav class="hidden items-center gap-8 md:flex" data-i18n-aria="nav.label">
        <a href="#services" class="text-small font-bold underline-offset-4 hover:underline" data-i18n="nav.services"></a>
        <a href="#projects" class="text-small font-bold underline-offset-4 hover:underline" data-i18n="nav.projects"></a>
        <a href="#process" class="text-small font-bold underline-offset-4 hover:underline" data-i18n="nav.process"></a>
        <a href="#contact" class="text-small font-bold underline-offset-4 hover:underline" data-i18n="nav.contact"></a>
      </nav>

      <div class="flex items-center gap-3">
        <div class="inline-flex rounded-button border-2 border-ink p-0.5" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="en" aria-pressed="true" class="rounded-[7px] px-2.5 py-1 text-small font-bold transition-colors hover:bg-linen aria-pressed:bg-ink aria-pressed:text-cream">EN</button>
          <button type="button" data-lang="pt" aria-pressed="false" class="rounded-[7px] px-2.5 py-1 text-small font-bold transition-colors hover:bg-linen aria-pressed:bg-ink aria-pressed:text-cream">PT</button>
        </div>
        <a href="#contact" class="btn btn-primary hidden px-5 py-2 md:inline-flex" data-i18n="nav.talk"></a>
        <button type="button" data-menu-button aria-expanded="false" aria-controls="mobile-menu" data-i18n-aria="nav.menu" class="group inline-flex h-11 w-11 items-center justify-center rounded-button border-2 border-ink md:hidden">
          <svg class="h-5 w-5 group-aria-expanded:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="hidden h-5 w-5 group-aria-expanded:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" hidden class="border-t border-line bg-cream md:hidden">
      <nav class="wrap flex flex-col gap-1 py-4" data-i18n-aria="nav.label">
        <a href="#services" class="py-3 text-body font-bold" data-i18n="nav.services"></a>
        <a href="#projects" class="py-3 text-body font-bold" data-i18n="nav.projects"></a>
        <a href="#process" class="py-3 text-body font-bold" data-i18n="nav.process"></a>
        <a href="#contact" class="py-3 text-body font-bold" data-i18n="nav.contact"></a>
        <a href="#contact" class="btn btn-primary mt-3" data-i18n="nav.talk"></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section id="top" class="pt-[clamp(3rem,8vw,6rem)] pb-[clamp(4rem,10vw,8rem)]" aria-labelledby="hero-title">
      <div class="wrap grid items-center gap-12 lg:grid-cols-12 lg:gap-8">
        <div class="lg:col-span-6">
          <h1 id="hero-title" class="text-display font-bold" data-i18n="hero.title"></h1>
          <p class="mt-6 max-w-[65ch] text-ink-soft" data-i18n="hero.text"></p>
          <div class="mt-8 flex flex-wrap gap-3">
            <a href="#" data-link="upwork" class="btn btn-primary" data-i18n="hero.upwork"></a>
            <a href="#projects" class="btn btn-secondary" data-i18n="hero.projects"></a>
          </div>
          <p class="mt-10 max-w-md border-t border-line pt-6 text-small text-ink-soft" data-i18n="hero.stack"></p>
        </div>

        <!-- A small site building itself, with the real load time of this page -->
        <div class="lg:col-span-6">
          <div class="overflow-hidden rounded-tile border-2 border-ink bg-linen shadow-window" role="img" data-i18n-aria="hero.mockAria">
            <div class="flex items-center gap-2 bg-ink px-4 py-3">
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="ml-3 rounded-full bg-ink-raised px-3 py-0.5 text-small text-cream-muted" data-i18n="hero.mockLabel"></span>
            </div>
            <div class="space-y-6 p-5 sm:p-6" aria-hidden="true">
              <div class="flex items-center justify-between gap-4">
                <span class="build h-3 w-20 rounded bg-ink" style="--i:0"></span>
                <span class="flex gap-3">
                  <span class="build h-2 w-10 rounded bg-ink-soft/50" style="--i:1"></span>
                  <span class="build h-2 w-10 rounded bg-ink-soft/50" style="--i:2"></span>
                  <span class="build hidden h-2 w-10 rounded bg-ink-soft/50 sm:block" style="--i:3"></span>
                </span>
                <span class="build h-6 w-16 rounded-md bg-orange" style="--i:4"></span>
              </div>
              <div class="space-y-3">
                <span class="build block h-4 w-3/4 rounded bg-ink" style="--i:5"></span>
                <span class="build block h-4 w-1/2 rounded bg-ink" style="--i:6"></span>
                <span class="build block h-2 w-2/3 rounded bg-ink-soft/40" style="--i:7"></span>
                <span class="build block h-8 w-28 rounded-md bg-orange" style="--i:8"></span>
              </div>
              <span class="build block h-28 rounded-lg bg-sand" style="--i:9"></span>
              <div class="grid grid-cols-3 gap-3">
                <span class="build h-14 rounded-lg bg-sand" style="--i:10"></span>
                <span class="build h-14 rounded-lg bg-sand" style="--i:11"></span>
                <span class="build h-14 rounded-lg bg-sand" style="--i:12"></span>
              </div>
            </div>
          </div>
          <!-- Shown only when the browser can measure the load time -->
          <p hidden data-ready class="mt-4 text-small text-ink-soft">
            <span data-i18n="hero.ready"></span>
            <strong class="text-ink"><span data-ms>0</span> <span data-i18n="hero.ms"></span></strong>
          </p>
        </div>
      </div>
    </section>

    <!-- What you get -->
    <section id="included" class="section-y bg-sand" aria-labelledby="included-title">
      <div class="wrap grid gap-10 lg:grid-cols-12 lg:gap-8">
        <div class="lg:col-span-5">
          <h2 id="included-title" class="text-title font-bold" data-i18n="included.title"></h2>
          <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="included.lead"></p>
        </div>
        <ul class="grid gap-x-8 gap-y-8 sm:grid-cols-2 lg:col-span-7">
          <li class="flex gap-4">
            <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
            <div>
              <h3 class="text-heading font-bold" data-i18n="included.1.title"></h3>
              <p class="mt-1 text-ink-soft" data-i18n="included.1.text"></p>
            </div>
          </li>
          <li class="flex gap-4">
            <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
            <div>
              <h3 class="text-heading font-bold" data-i18n="included.2.title"></h3>
              <p class="mt-1 text-ink-soft" data-i18n="included.2.text"></p>
            </div>
          </li>
          <li class="flex gap-4">
            <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
            <div>
              <h3 class="text-heading font-bold" data-i18n="included.3.title"></h3>
              <p class="mt-1 text-ink-soft" data-i18n="included.3.text"></p>
            </div>
          </li>
          <li class="flex gap-4">
            <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
            <div>
              <h3 class="text-heading font-bold" data-i18n="included.4.title"></h3>
              <p class="mt-1 text-ink-soft" data-i18n="included.4.text"></p>
            </div>
          </li>
        </ul>
      </div>
    </section>

    <!-- Services -->
    <section id="services" class="section-y" aria-labelledby="services-title">
      <div class="wrap">
        <h2 id="services-title" class="text-title font-bold" data-i18n="services.title"></h2>
        <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="services.lead"></p>

        <ul class="mt-12 border-b border-line">
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.1.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.1.text"></p>
          </li>
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.2.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.2.text"></p>
          </li>
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.3.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.3.text"></p>
          </li>
        </ul>
      </div>
    </section>

    <!-- Projects. Content comes from SITE.projects in main.js -->
    <section id="projects" class="section-y bg-sand" aria-labelledby="projects-title">
      <div class="wrap">
        <h2 id="projects-title" class="text-title font-bold" data-i18n="projects.title"></h2>
        <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="projects.lead"></p>

        <div class="mt-12 grid gap-6 md:grid-cols-2">
          <article data-project="0" class="overflow-hidden rounded-3xl border border-line bg-cream md:col-span-2">
            <div data-project-media class="flex aspect-16/10 items-center justify-center bg-linen text-ink-soft md:aspect-21/9"></div>
            <div class="p-6 md:p-8">
              <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
              <h3 data-project-title class="mt-3 text-heading font-bold"></h3>
              <p data-project-text class="mt-2 max-w-[65ch] text-ink-soft"></p>
              <a data-project-link href="#" class="mt-4 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
            </div>
          </article>
          <article data-project="1" class="overflow-hidden rounded-tile border border-line bg-cream">
            <div data-project-media class="flex aspect-4/3 items-center justify-center bg-linen text-ink-soft"></div>
            <div class="p-6">
              <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
              <h3 data-project-title class="mt-3 text-heading font-bold"></h3>
              <p data-project-text class="mt-2 text-ink-soft"></p>
              <a data-project-link href="#" class="mt-4 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
            </div>
          </article>
          <article data-project="2" class="overflow-hidden rounded-tile border border-line bg-cream">
            <div data-project-media class="flex aspect-4/3 items-center justify-center bg-linen text-ink-soft"></div>
            <div class="p-6">
              <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
              <h3 data-project-title class="mt-3 text-heading font-bold"></h3>
              <p data-project-text class="mt-2 text-ink-soft"></p>
              <a data-project-link href="#" class="mt-4 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- Process -->
    <section id="process" class="on-dark section-y bg-ink text-cream" aria-labelledby="process-title">
      <div class="wrap grid items-center gap-10 lg:grid-cols-12 lg:gap-8">
        <div class="lg:col-span-5">
          <h2 id="process-title" class="text-title font-bold" data-i18n="process.title"></h2>
          <p class="mt-4 max-w-[65ch] text-cream-muted" data-i18n="process.lead"></p>
        </div>

        <div class="overflow-hidden rounded-tile border border-cream/10 bg-ink-raised lg:col-span-7">
          <div class="flex items-center gap-2 border-b border-cream/10 px-4 py-3">
            <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/50"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/50"></span>
            <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/50"></span>
            <span class="ml-3 font-mono text-small text-cream-muted" data-i18n="process.terminal"></span>
          </div>
          <div class="wrap-break-word p-5 font-mono text-code sm:p-6">
            <p><span class="text-amber">$</span> <span data-i18n="process.command"></span></p>
            <ol class="mt-5 space-y-5">
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">1</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.1.title"></p>
                  <p class="text-cream-muted" data-i18n="process.1.text"></p>
                </div>
              </li>
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">2</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.2.title"></p>
                  <p class="text-cream-muted" data-i18n="process.2.text"></p>
                </div>
              </li>
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">3</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.3.title"></p>
                  <p class="text-cream-muted" data-i18n="process.3.text"></p>
                </div>
              </li>
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">4</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.4.title"></p>
                  <p class="text-cream-muted" data-i18n="process.4.text"></p>
                </div>
              </li>
            </ol>
            <p class="mt-6"><span class="text-amber">$</span> <span data-i18n="process.done"></span></p>
          </div>
        </div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section-y" aria-labelledby="about-title">
      <div class="wrap grid items-center gap-10 lg:grid-cols-12 lg:gap-8">
        <div data-about-photo class="flex aspect-square max-w-sm items-center justify-center overflow-hidden rounded-tile bg-sand text-[6rem] font-bold text-ink lg:col-span-4"></div>
        <div class="lg:col-span-7 lg:col-start-6">
          <h2 id="about-title" class="text-title font-bold" data-i18n="about.title"></h2>
          <p class="mt-4 max-w-[65ch]" data-i18n="about.text1"></p>
          <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="about.text2"></p>
          <ul data-stack class="mt-6 flex flex-wrap gap-2" data-i18n-aria="about.stack"></ul>
        </div>
      </div>
    </section>

    <!-- Final call to action -->
    <section id="contact" class="on-dark section-y bg-ink text-cream" aria-labelledby="contact-title">
      <div class="wrap">
        <h2 id="contact-title" class="text-display font-bold" data-i18n="contact.title"></h2>
        <p class="mt-6 max-w-[65ch] text-cream-muted" data-i18n="contact.text"></p>
        <div class="mt-8 flex flex-wrap gap-3">
          <a href="#" data-link="upwork" class="btn btn-primary" data-i18n="hero.upwork"></a>
          <a href="#" data-link="email" class="btn btn-secondary-dark" data-i18n="footer.email"></a>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="on-dark border-t border-cream/15 bg-ink text-cream">
    <div class="wrap flex flex-col gap-6 py-10 sm:flex-row sm:items-center sm:justify-between">
      <p class="text-small text-cream-muted" data-copyright></p>
      <ul class="flex flex-wrap gap-x-6 gap-y-2">
        <li><a href="#" data-link="email" class="font-bold underline-offset-4 hover:underline" data-i18n="footer.email"></a></li>
        <li><a href="#" data-link="linkedin" class="font-bold underline-offset-4 hover:underline" data-i18n="footer.linkedin"></a></li>
        <li><a href="#" data-link="github" class="font-bold underline-offset-4 hover:underline" data-i18n="footer.github"></a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
