<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Samuel Dutra | Front-end developer</title>
  <meta name="description" content="Portfolio of Samuel Dutra, a freelance front-end developer building fast websites, online stores and dashboards.">
  <meta name="theme-color" content="#FEF3E2">

  <!-- Open Graph. TODO: add og:image and og:url once the site has a public address. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Samuel Dutra | Front-end developer">
  <meta property="og:description" content="Portfolio of Samuel Dutra, a freelance front-end developer building fast websites, online stores and dashboards.">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/tailwind.css">
  <link rel="stylesheet" href="style.css">
  <script src="assets/gsap.min.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link" data-i18n="skip"></a>

  <!-- Header -->
  <header data-header class="sticky top-0 z-50 border-b border-transparent bg-cream transition-colors duration-200 data-scrolled:border-line">
    <div class="wrap flex h-16 items-center justify-between gap-4 md:h-18">
      <a href="#top" class="text-xl font-bold transition-colors duration-150 hover:text-orange">Samuel Dutra</a>

      <nav class="hidden items-center gap-8 lg:flex" data-i18n-aria="nav.label">
        <a href="#services" class="nav-link" data-i18n="nav.services"></a>
        <a href="#projects" class="nav-link" data-i18n="nav.projects"></a>
        <a href="#process" class="nav-link" data-i18n="nav.process"></a>
        <a href="#contact" class="nav-link" data-i18n="nav.contact"></a>
      </nav>

      <div class="flex items-center gap-3">
        <div class="lang-switch" role="group" data-lang-switch data-i18n-aria="lang.label">
          <span class="lang-thumb" aria-hidden="true"></span>
          <button type="button" data-lang="en" aria-pressed="true" class="lang-option">EN</button>
          <button type="button" data-lang="pt" aria-pressed="false" class="lang-option">PT</button>
        </div>
        <a href="#contact" class="btn btn-primary hidden px-5 py-2 lg:inline-flex" data-i18n="nav.talk"></a>
        <button type="button" data-menu-button aria-expanded="false" aria-controls="mobile-menu" data-i18n-aria="nav.menu" class="group inline-grid h-11 w-11 place-items-center rounded-button border-2 border-ink lg:hidden">
          <svg class="col-start-1 row-start-1 h-5 w-5 transition duration-200 group-aria-expanded:rotate-90 group-aria-expanded:opacity-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="col-start-1 row-start-1 h-5 w-5 -rotate-90 opacity-0 transition duration-200 group-aria-expanded:rotate-0 group-aria-expanded:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="absolute inset-x-0 top-full -mt-px border-y border-line bg-cream lg:hidden">
      <nav class="wrap flex flex-col gap-1 py-4" data-i18n-aria="nav.label">
        <a href="#services" class="py-3 text-body font-bold" data-i18n="nav.services"></a>
        <a href="#projects" class="py-3 text-body font-bold" data-i18n="nav.projects"></a>
        <a href="#process" class="py-3 text-body font-bold" data-i18n="nav.process"></a>
        <a href="#contact" class="py-3 text-body font-bold" data-i18n="nav.contact"></a>
        <a href="#contact" class="btn btn-primary mt-3 self-start" data-i18n="nav.talk"></a>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- Hero -->
    <section id="top" class="pt-[clamp(3rem,8vw,6rem)] pb-[clamp(4rem,10vw,8rem)]" aria-labelledby="hero-title">
      <div class="wrap grid items-center gap-12 lg:grid-cols-12 lg:gap-8">
        <div class="lg:col-span-6">
          <h1 id="hero-title" class="text-display font-bold" data-i18n="hero.title"></h1>
          <p class="mt-6 max-w-[min(80%,65ch)] text-ink-soft" data-i18n="hero.text"></p>
          <div class="mt-8 flex flex-wrap gap-3">
            <a href="#" data-link="upwork" class="btn btn-primary" data-i18n="hero.upwork"></a>
            <a href="#projects" class="btn btn-secondary" data-i18n="hero.projects"></a>
          </div>
          <p class="mt-10 max-w-md border-t border-line pt-6 text-small text-ink-soft" data-i18n="hero.stack"></p>
        </div>

        <!-- A small site building itself, with the real load time of this page -->
        <div class="lg:col-span-6">
          <div data-mock class="overflow-hidden rounded-tile border-2 border-ink bg-linen shadow-window" role="img" data-i18n-aria="hero.mockAria">
            <div class="flex items-center gap-2 bg-ink px-4 py-3">
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="h-2.5 w-2.5 rounded-full bg-cream-muted/60"></span>
              <span class="ml-3 rounded-full bg-ink-raised px-3 py-0.5 text-small text-cream-muted" data-i18n="hero.mockLabel"></span>
            </div>
            <div class="space-y-6 p-5 sm:p-6" aria-hidden="true">
              <div class="flex items-center justify-between gap-4">
                <span class="build h-3 w-20 rounded bg-ink" style="--i:0"></span>
                <span class="flex gap-3">
                  <span class="build h-2 w-10 rounded bg-ink-soft/50" style="--i:1"></span>
                  <span class="build h-2 w-10 rounded bg-ink-soft/50" style="--i:2"></span>
                  <span class="build hidden h-2 w-10 rounded bg-ink-soft/50 sm:block" style="--i:3"></span>
                </span>
                <span class="build h-6 w-16 rounded-md bg-orange" style="--i:4"></span>
              </div>
              <div class="space-y-3">
                <span class="build block h-4 w-3/4 rounded bg-ink" style="--i:5"></span>
                <span class="build block h-4 w-1/2 rounded bg-ink" style="--i:6"></span>
                <span class="build block h-2 w-2/3 rounded bg-ink-soft/40" style="--i:7"></span>
                <span class="build block h-8 w-28 rounded-md bg-orange" style="--i:8"></span>
              </div>
              <span class="build block h-28 rounded-lg bg-sand" style="--i:9"></span>
              <div class="grid grid-cols-3 gap-3">
                <span class="build h-14 rounded-lg bg-sand" style="--i:10"></span>
                <span class="build h-14 rounded-lg bg-sand" style="--i:11"></span>
                <span class="build h-14 rounded-lg bg-sand" style="--i:12"></span>
              </div>
            </div>
          </div>
          <!-- Shown only when the browser can measure the load time. invisible (not hidden) keeps its space, so nothing shifts when it appears -->
          <p data-ready class="invisible mt-4 text-small text-ink-soft">
            <span data-i18n="hero.ready"></span>
            <strong class="text-ink"><span data-ms>0</span> <span data-i18n="hero.ms"></span></strong>
          </p>
        </div>
      </div>
    </section>

    <!-- What you get. Scores come from SITE.scores in main.js -->
    <section id="included" class="section-y bg-sand" aria-labelledby="included-title">
      <div class="wrap">
        <h2 id="included-title" class="text-title font-bold" data-i18n="included.title"></h2>
        <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="included.lead"></p>

        <!-- Report card: the three measured rings and a small label at the bottom center.
             The rings fill and the numbers count up once it scrolls into view -->
        <div data-report class="mt-12 overflow-hidden rounded-3xl border border-line bg-cream">

          <ul class="grid divide-y divide-line sm:grid-cols-3 sm:divide-x sm:divide-y-0">
            <li data-gauge="performance" class="flex flex-col items-center gap-4 p-6 text-center min-[400px]:flex-row min-[400px]:gap-5 min-[400px]:text-left sm:flex-col sm:gap-5 sm:text-center md:p-8">
              <div class="relative h-28 w-28 shrink-0 sm:h-36 sm:w-36 lg:h-40 lg:w-40" aria-hidden="true">
                <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100" fill="none" stroke-width="2.2">
                  <circle cx="50" cy="50" r="46" class="fill-score-soft stroke-score/25"/>
                  <circle cx="50" cy="50" r="46" pathLength="100" class="gauge-arc stroke-score"/>
                </svg>
                <span data-gauge-value class="absolute inset-0 flex items-center justify-center text-title font-normal text-score-ink lg:text-[3.75rem]"></span>
              </div>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.performance.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.performance.text"></p>
                <p class="sr-only" data-gauge-sr></p>
              </div>
            </li>
            <li data-gauge="seo" class="flex flex-col items-center gap-4 p-6 text-center min-[400px]:flex-row min-[400px]:gap-5 min-[400px]:text-left sm:flex-col sm:gap-5 sm:text-center md:p-8">
              <div class="relative h-28 w-28 shrink-0 sm:h-36 sm:w-36 lg:h-40 lg:w-40" aria-hidden="true">
                <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100" fill="none" stroke-width="2.2">
                  <circle cx="50" cy="50" r="46" class="fill-score-soft stroke-score/25"/>
                  <circle cx="50" cy="50" r="46" pathLength="100" class="gauge-arc stroke-score"/>
                </svg>
                <span data-gauge-value class="absolute inset-0 flex items-center justify-center text-title font-normal text-score-ink lg:text-[3.75rem]"></span>
              </div>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.seo.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.seo.text"></p>
                <p class="sr-only" data-gauge-sr></p>
              </div>
            </li>
            <li data-gauge="accessibility" class="flex flex-col items-center gap-4 p-6 text-center min-[400px]:flex-row min-[400px]:gap-5 min-[400px]:text-left sm:flex-col sm:gap-5 sm:text-center md:p-8">
              <div class="relative h-28 w-28 shrink-0 sm:h-36 sm:w-36 lg:h-40 lg:w-40" aria-hidden="true">
                <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100" fill="none" stroke-width="2.2">
                  <circle cx="50" cy="50" r="46" class="fill-score-soft stroke-score/25"/>
                  <circle cx="50" cy="50" r="46" pathLength="100" class="gauge-arc stroke-score"/>
                </svg>
                <span data-gauge-value class="absolute inset-0 flex items-center justify-center text-title font-normal text-score-ink lg:text-[3.75rem]"></span>
              </div>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.accessibility.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.accessibility.text"></p>
                <p class="sr-only" data-gauge-sr></p>
              </div>
            </li>
          </ul>

          <p class="mx-auto mb-6 mt-2 w-fit max-w-[calc(100%-3rem)] rounded-2xl bg-linen px-3 py-1 text-center text-small text-ink-soft sm:rounded-full sm:py-0.5 md:mb-8 md:max-w-[calc(100%-4rem)]" data-i18n="included.report"></p>
        </div>

        <!-- Second card, with the sand background showing between the two -->
        <div class="mt-6 overflow-hidden rounded-3xl border border-line bg-cream">
          <ul class="grid divide-y divide-line sm:grid-cols-3 sm:divide-x sm:divide-y-0">
            <li class="flex gap-4 p-6 md:p-8">
              <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.responsive.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.responsive.text"></p>
              </div>
            </li>
            <li class="flex gap-4 p-6 md:p-8">
              <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.clean.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.clean.text"></p>
              </div>
            </li>
            <li class="flex gap-4 p-6 md:p-8">
              <svg class="mt-1 h-6 w-6 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
              <div>
                <h3 class="text-heading font-bold" data-i18n="included.support.title"></h3>
                <p class="mt-1 text-ink-soft" data-i18n="included.support.text"></p>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Services -->
    <section id="services" class="section-y" aria-labelledby="services-title">
      <div class="wrap">
        <h2 id="services-title" class="text-title font-bold" data-i18n="services.title"></h2>
        <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="services.lead"></p>

        <ul class="mt-12 border-b border-line">
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.1.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.1.text"></p>
          </li>
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.2.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.2.text"></p>
          </li>
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.3.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.3.text"></p>
          </li>
          <li class="grid gap-3 border-t border-line py-8 md:grid-cols-12 md:gap-8">
            <h3 class="text-heading font-bold md:col-span-4" data-i18n="services.4.title"></h3>
            <p class="max-w-[65ch] text-ink-soft md:col-span-8" data-i18n="services.4.text"></p>
          </li>
        </ul>
      </div>
    </section>

    <!-- Projects. Content comes from SITE.projects in main.js -->
    <section id="projects" class="section-y bg-sand" aria-labelledby="projects-title">
      <div class="wrap">
        <h2 id="projects-title" class="text-title font-bold" data-i18n="projects.title"></h2>
        <p class="mt-4 max-w-[65ch] text-ink-soft" data-i18n="projects.lead"></p>

        <div class="mt-12 grid items-start gap-6 md:grid-cols-2">
          <article data-project="0" class="project relative overflow-hidden rounded-3xl md:col-span-2 border border-line bg-cream">
            <div data-project-media class="flex aspect-16/10 md:aspect-21/9 items-center justify-center bg-linen text-ink-soft"></div>
            <div class="p-6 md:p-8">
              <div class="flex flex-wrap items-center gap-3">
                <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
                <span data-project-type class="text-small text-ink-soft"></span>
              </div>
              <h3 class="mt-3 text-heading font-bold">
                <button type="button" data-project-toggle data-project-title aria-expanded="false" aria-controls="project-0-more" class="project-toggle text-left"></button>
              </h3>
              <p data-project-text class="mt-2 max-w-[65ch] text-ink-soft"></p>
              <span class="project-cue mt-4 inline-flex items-center gap-2 font-bold" aria-hidden="true">
                <span data-i18n="projects.details"></span>
                <svg class="project-cue-icon h-8 w-8 rounded-full border-2 border-ink p-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
              </span>

              <!-- Revealed on click. Content comes from SITE.projects[n].details -->
              <div id="project-0-more" data-project-more class="project-more">
                <div>
                  <div class="project-more-inner mt-6 border-t border-line pt-6">
                    <dl class="grid gap-6 md:grid-cols-2">
                      <div>
                        <dt class="font-bold" data-i18n="projects.about"></dt>
                        <dd data-project-about class="mt-1 max-w-[65ch] text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.role"></dt>
                        <dd data-project-role class="mt-1 text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.stack"></dt>
                        <dd class="mt-2"><ul data-project-stack class="flex flex-wrap gap-2"></ul></dd>
                      </div>
                    </dl>
                    <a data-project-link href="#" class="mt-6 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
                  </div>
                </div>
              </div>
            </div>
          </article>
          <article data-project="1" class="project relative overflow-hidden rounded-tile border border-line bg-cream">
            <div data-project-media class="flex aspect-4/3 items-center justify-center bg-linen text-ink-soft"></div>
            <div class="p-6">
              <div class="flex flex-wrap items-center gap-3">
                <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
                <span data-project-type class="text-small text-ink-soft"></span>
              </div>
              <h3 class="mt-3 text-heading font-bold">
                <button type="button" data-project-toggle data-project-title aria-expanded="false" aria-controls="project-1-more" class="project-toggle text-left"></button>
              </h3>
              <p data-project-text class="mt-2 text-ink-soft"></p>
              <span class="project-cue mt-4 inline-flex items-center gap-2 font-bold" aria-hidden="true">
                <span data-i18n="projects.details"></span>
                <svg class="project-cue-icon h-8 w-8 rounded-full border-2 border-ink p-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
              </span>

              <!-- Revealed on click. Content comes from SITE.projects[n].details -->
              <div id="project-1-more" data-project-more class="project-more">
                <div>
                  <div class="project-more-inner mt-6 border-t border-line pt-6">
                    <dl class="grid gap-6 ">
                      <div>
                        <dt class="font-bold" data-i18n="projects.about"></dt>
                        <dd data-project-about class="mt-1 max-w-[65ch] text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.role"></dt>
                        <dd data-project-role class="mt-1 text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.stack"></dt>
                        <dd class="mt-2"><ul data-project-stack class="flex flex-wrap gap-2"></ul></dd>
                      </div>
                    </dl>
                    <a data-project-link href="#" class="mt-6 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
                  </div>
                </div>
              </div>
            </div>
          </article>
          <article data-project="2" class="project relative overflow-hidden rounded-tile border border-line bg-cream">
            <div data-project-media class="flex aspect-4/3 items-center justify-center bg-linen text-ink-soft"></div>
            <div class="p-6">
              <div class="flex flex-wrap items-center gap-3">
                <span data-project-badge class="inline-block rounded-full bg-amber px-3 py-0.5 text-small font-bold text-ink" data-i18n="projects.placeholder"></span>
                <span data-project-type class="text-small text-ink-soft"></span>
              </div>
              <h3 class="mt-3 text-heading font-bold">
                <button type="button" data-project-toggle data-project-title aria-expanded="false" aria-controls="project-2-more" class="project-toggle text-left"></button>
              </h3>
              <p data-project-text class="mt-2 text-ink-soft"></p>
              <span class="project-cue mt-4 inline-flex items-center gap-2 font-bold" aria-hidden="true">
                <span data-i18n="projects.details"></span>
                <svg class="project-cue-icon h-8 w-8 rounded-full border-2 border-ink p-1.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
              </span>

              <!-- Revealed on click. Content comes from SITE.projects[n].details -->
              <div id="project-2-more" data-project-more class="project-more">
                <div>
                  <div class="project-more-inner mt-6 border-t border-line pt-6">
                    <dl class="grid gap-6 ">
                      <div>
                        <dt class="font-bold" data-i18n="projects.about"></dt>
                        <dd data-project-about class="mt-1 max-w-[65ch] text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.role"></dt>
                        <dd data-project-role class="mt-1 text-ink-soft"></dd>
                      </div>
                      <div>
                        <dt class="font-bold" data-i18n="projects.stack"></dt>
                        <dd class="mt-2"><ul data-project-stack class="flex flex-wrap gap-2"></ul></dd>
                      </div>
                    </dl>
                    <a data-project-link href="#" class="mt-6 inline-block font-bold underline underline-offset-4 hover:text-orange-deep" data-i18n="projects.view"></a>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- Process -->
    <section id="process" class="on-dark section-y bg-ink text-cream" aria-labelledby="process-title">
      <div class="wrap grid items-center gap-10 lg:grid-cols-12 lg:gap-8">
        <div class="lg:col-span-5">
          <h2 id="process-title" class="text-title font-bold" data-i18n="process.title"></h2>
          <p class="mt-4 max-w-[65ch] text-cream-muted" data-i18n="process.lead"></p>
        </div>

        <div class="overflow-hidden rounded-tile border border-cream/10 bg-ink-raised lg:col-span-7">

            <p><span class="text-amber">$</span> <span data-i18n="process.command"></span></p>
            <ol class="mt-5 space-y-5">
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">1</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.1.title"></p>
                  <p class="text-cream-muted" data-i18n="process.1.text"></p>
                </div>
              </li>
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">2</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.2.title"></p>

              <li class="grid grid-cols-[auto_1fr] gap-x-3">

              </li>
              <li class="grid grid-cols-[auto_1fr] gap-x-3">
                <span class="text-amber">4</span>
                <div>
                  <p class="font-bold text-cream" data-i18n="process.4.title"></p>
                  <p class="text-cream-muted" data-i18n="process.4.text"></p>
                </div>
              </li>
            </ol>
            <p class="mt-6"><span class="text-amber">$</span> <span data-i18n="process.done"></span></p>
          </div>
        </div>
      </div>
    </section>

    <!-- About -->
